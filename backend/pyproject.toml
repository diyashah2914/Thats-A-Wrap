[project]
name = "thats-a-wrap-contingency-backend"
version = "0.1.0"
description = "Contingency backend for That's a Wrap! — AI agents and real media processing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "python-dotenv>=1.1,<2",
  "google-genai>=1.32,<2",
  "google-adk==2.8.0",
  "mcp>=1.29,<2",
  "mcp-grafana==1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
