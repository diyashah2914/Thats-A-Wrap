server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        http:
        grpc:
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
query_frontend:
  mcp_server:
    enabled: true
overrides:
  defaults:
    metrics_generator:
      processors: []
